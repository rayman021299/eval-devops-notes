groups:
  - name: alertes-application
    rules:
      - alert: TauxErreurEleve
        expr: >
          sum(rate(http_requests_total{code=~"5.."}[1m]))
          / sum(rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx superieur a 5%"
          description: "Plus de 5% des requetes echouent avec une 5xx depuis 30 secondes."

      - alert: LatenceDegradee
        expr: >
          histogram_quantile(0.95, sum by (le, endpoint) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 500ms"
          description: "95% des requetes mettent plus de 500ms depuis plus de 1 minute."
