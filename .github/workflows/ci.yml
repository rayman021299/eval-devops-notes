name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python via action locale
        uses: ./.github/actions/setup-python-deps

      - name: Lancer le linting Python (flake8)
        run: flake8 .

      - name: Lancer le linting YAML
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python ${{ matrix.python-version }} via action locale
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Executer les tests avec rapport JUnit
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit-${{ matrix.python-version }}.xml

      - name: Publier les rapports de tests en artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Tester la construction de l'image Docker
        run: docker build -t app:test .

  ci-ok:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validation finale du pipeline
        run: echo "Tous les jobs sont passés avec succès !"
